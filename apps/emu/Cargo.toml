[package]
name = "simee-emu"
description = "simee CLI: a drop-in for the Android SDK `emulator` binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "emulator", "avd", "hypervisor", "mobile"]
categories = ["emulators", "command-line-utilities", "development-tools::testing"]
include = ["/Cargo.toml", "/LICENSE", "/build.rs", "/src", "/tests"]

[[bin]]
name = "emu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
emu-avd.workspace = true
emu-sdk.workspace = true
emu-ext4.workspace = true
emu-vmm.workspace = true
emu-gfxstream.workspace = true
emu-hvf.workspace = true
libc.workspace = true
rustix.workspace = true
sim-core.workspace = true

# Software mode runs the guest on KVM when the host's /dev/kvm is usable.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
emu-kvm.workspace = true

[dev-dependencies]
emu-sdk = { workspace = true, features = ["testing"] }
sim-android.workspace = true

# `deny`, not the workspace's `forbid`: `shutdown_signals` (signal masks) opts back in, and is the
# only unsafe code in this crate.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
