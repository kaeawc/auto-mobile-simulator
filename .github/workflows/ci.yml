name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: rustfmt --check --edition 2024 desktop/src/main.rs

  # The shared core, the API, the CLI and the Android device models build everywhere; the
  # macOS-only backends (and the VMM's hypervisor half) compile to nothing here, so this job checks
  # everything that isn't FFI without a macOS runner, and measures its coverage.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --profile ci -- -D warnings
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # The tests run once, instrumented. Per-file coverage goes to the job summary, and the job
      # fails when line coverage drops under the floor: raise it as coverage grows, never lower it
      # to get green.
      - run: cargo llvm-cov nextest --locked --workspace --cargo-profile ci --no-report --hide-progress-bar
      - run: |
          {
            echo '### Coverage (Linux)'
            echo '```text'
            cargo llvm-cov report --profile ci --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --profile ci --lcov --output-path lcov.info --fail-under-lines 85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: lcov.info

  # The simulator service and Hypervisor.framework only exist on macOS, so the iOS and Android
  # backends are linted and tested there (unit tests don't need the hypervisor).
  lint-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets --profile ci -- -D warnings
      - run: cargo test --locked --profile ci
      # The Android emulator binary. Booting a guest needs nested Hypervisor.framework, which
      # hosted runners lack, so that stays a local check (docs/android.md).
      - run: cargo build --locked --release -p emu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emu-macos-arm64
          path: target/release/emu

  desktop:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cd desktop && cargo clippy --locked --all-targets --profile ci -- -D warnings
      - run: cd desktop && cargo test --locked --profile ci

  # The window and its headless view tests also run on Linux: the iOS side compiles to a stub
  # there (desktop/src/device.rs), so labels, scenes and input mapping are checked without a Mac.
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          shared-key: desktop-linux
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cd desktop && cargo clippy --locked --all-targets --profile ci -- -D warnings
      - run: cd desktop && cargo test --locked --profile ci

  # Temporary probe (#54): which hosted runners expose /dev/kvm.
  kvm-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          uname -a; nproc; free -m
          ls -l /dev/kvm || echo "no /dev/kvm"
          grep -m1 -E 'vmx|svm' /proc/cpuinfo >/dev/null && echo "x86 virt flag present" || echo "no x86 virt flag"
          dmesg 2>/dev/null | grep -i kvm | head || true
          sudo dmesg | grep -iE 'kvm|el2|hyp' | head -20 || true
          ls /sys/module | grep -i kvm || echo "no kvm module"
          cat /sys/devices/system/cpu/cpu0/regs/identification/midr_el1 2>/dev/null || true
          ls -l /dev/hugepages /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null; cat /sys/kernel/mm/transparent_hugepage/enabled || true
