name: Software mode

# Boots an API 36 x86_64 image in emu's software mode (QEMU with emu's devices, #55) on a hosted
# runner, and checks it the way a user would: `sys.boot_completed`, a screenshot over
# display.sock, a tap and a clean stop through the console; on main and manual runs also the
# launcher drawn. It runs twice: on the runner's KVM (x86_64 hosted runners expose /dev/kvm), and
# with `-accel off` in QEMU's TCG, as on a host without KVM. The KVM run then first-boots the same
# image in the stock emulator on the same runner, and both boot times go to the job summary. QEMU
# 11.1 (Ubuntu's is older) is built once and cached, as are the system image and the SDK's Linux
# renderer.
on:
  # Every push to main runs the full check.
  push:
    branches: [main]
  # A pull request runs it only when the change can reach what `cargo build -p simee-emu -p simee`
  # compiles on Linux: every crate those two pull in, the lockfile and the toolchain. Not: tests,
  # examples, benches and docs, and the files that build gates off Linux from another file
  # (macOS-only modules behind a `#[cfg] mod` line, the Objective-C only they include). A file
  # gated off only by its own `#![cfg]` stays in (editing it alone can turn it on). Later
  # patterns win over earlier ones. `scripts/ci-scope.py check` (CI's fmt job,
  # scripts/check.sh) fails when a file that build reads is skipped, or a crate it doesn't build
  # is named.
  pull_request:
    paths:
      - "apps/emu/**"
      - "apps/simee/**"
      - "crates/emu-avd/**"
      - "crates/emu-ext4/**"
      - "crates/emu-fdt/**"
      - "crates/emu-gfxstream/**"
      - "crates/emu-hvf/**"
      - "crates/emu-kvm/**"
      - "crates/emu-sdk/**"
      - "crates/emu-vmm/**"
      - "crates/sim-android/**"
      - "crates/sim-api/**"
      - "crates/sim-audio/**"
      - "crates/sim-bundle/**"
      - "crates/sim-camera/**"
      - "crates/sim-core/**"
      - "crates/sim-coresim/**"
      - "crates/sim-debug/**"
      - "crates/sim-host/**"
      - "crates/sim-mcp/**"
      - "crates/sim-netshape/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/actions/rust-toolchain/**"
      - ".github/actions/enable-kvm/**"
      - ".github/workflows/software-mode.yml"
      - "!**/*.md"
      - "!**/tests/**"
      - "!**/tests.rs"
      - "!**/examples/**"
      - "!**/benches/**"
      - "!apps/emu/src/vkprobe.rs"
      - "!crates/emu-gfxstream/src/channel.rs"
      - "!crates/emu-gfxstream/src/macho.rs"
      - "!crates/emu-hvf/src/ffi.rs"
      - "!crates/emu-hvf/src/hv.rs"
      - "!crates/emu-vmm/src/machine.rs"
      - "!crates/emu-vmm/src/vcpu.rs"
      - "!crates/sim-api/native/displaytool.entitlements"
      - "!crates/sim-api/native/displaytool.m"
      - "!crates/sim-api/src/duo.rs"
      - "!crates/sim-api/src/ios.rs"
      - "!crates/sim-coresim/src/carplay.rs"
      - "!crates/sim-coresim/src/display.rs"
      - "!crates/sim-coresim/src/error.rs"
      - "!crates/sim-coresim/src/hid.rs"
      - "!crates/sim-coresim/src/procs.rs"
      - "!crates/sim-coresim/src/rt.rs"
      - "!crates/sim-coresim/src/service.rs"
  workflow_dispatch:

concurrency:
  group: software-mode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  QEMU_VERSION: 11.1.3
  # sha256 of download.qemu.org's qemu-11.1.3.tar.xz.
  QEMU_SHA256: 5a8289c7940dc77d3873c81a6c29ba3afe1446fc9d36e77fa1658cdbecb84b22

jobs:
  boot:
    name: boot (${{ matrix.accel }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        accel: [kvm, tcg]
    steps:
      # Everything outside the checkout lives under the runner's temp dir. The runner exports
      # ANDROID_SDK_ROOT for its preinstalled SDK, and emu prefers it, so both point at the
      # cached one.
      - name: Paths
        run: |
          {
            echo "ANDROID_HOME=$RUNNER_TEMP/sdk"
            echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/sdk"
            echo "ANDROID_AVD_HOME=$RUNNER_TEMP/avd"
            echo "QEMU_PREFIX=$RUNNER_TEMP/qemu"
            echo "EMU_QEMU=$RUNNER_TEMP/qemu/bin/qemu-system-x86_64"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.accel == 'kvm'
        uses: ./.github/actions/enable-kvm
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: software-mode
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # QEMU's build dependencies also bring the libraries it runs on; the renderer needs X11's,
      # the stock emulator also PulseAudio's, ALSA's, GL's and NSS's.
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ninja-build libglib2.0-dev libpixman-1-dev libslirp-dev \
            libfdt-dev flex bison python3-venv libx11-6 libxcb1 libpulse0 libasound2t64 libgl1 libnss3 libxkbfile1 libx11-xcb1
      - id: qemu-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-${{ env.QEMU_VERSION }}-x86_64-${{ runner.os }}-v1
      - name: Build QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLo qemu.tar.xz "https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz"
          echo "$QEMU_SHA256  qemu.tar.xz" | sha256sum -c
          tar xf qemu.tar.xz
          cd "qemu-$QEMU_VERSION"
          ./configure --prefix="$QEMU_PREFIX" --target-list=x86_64-softmmu --disable-docs --disable-werror \
            --enable-slirp --enable-fdt=system --disable-gtk --disable-sdl --disable-opengl --disable-spice --disable-vnc \
            --disable-xen --disable-debug-info
          make -j"$(nproc)"
          make install
      - run: $EMU_QEMU -version
      - run: cargo build --locked --release -p simee-emu -p simee
      - id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sdk
          key: sdk-android-36-default-x86_64-${{ runner.os }}-v1
      # emu's own provisioning: verified downloads, no Java.
      - name: Provision
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          target/release/emu -provision 36 -tag default -abi x86_64
      # -no-golden: the next steps test a first boot, and a golden is another full boot of this job.
      - run: target/release/emu -create-avd ci -sysdir system-images/android-36/default/x86_64 -no-golden
      - run: target/release/emu -avd ci -dry-run
      # Every run checks `sys.boot_completed`, a screenshot of the display's size that isn't one
      # solid colour (polled, 40 tries: right after boot the capture can still fail or come back
      # blank), a tap and a clean stop through the console. Main and manual runs also give the
      # launcher 30 s and want a screenshot of it (over 20 kB); a pull request goes on as soon as
      # something is drawn.
      - name: Boot, screenshot, tap, stop
        env:
          FULL: ${{ github.event_name != 'pull_request' }}
          ACCEL: ${{ matrix.accel }}
        run: |
          # Exits 0 when the PNG is 720x1280, over $2 bytes and not one solid colour.
          cat > "$RUNNER_TEMP/drawn.py" <<'EOF'
          import struct, sys, zlib
          d = open(sys.argv[1], "rb").read()
          w, h, depth, ctype = struct.unpack(">IIBB", d[16:26])
          bpp = {0: 1, 2: 3, 4: 2, 6: 4}[ctype] * depth // 8
          data, i = b"", 8
          while i < len(d):
              n, kind = struct.unpack(">I4s", d[i:i + 8])
              data += d[i + 8:i + 8 + n] if kind == b"IDAT" else b""
              i += 12 + n
          raw, stride = zlib.decompress(data), w * bpp
          prev, first, solid = bytearray(stride), None, True
          for y in range(h):
              f, line = raw[y * (stride + 1)], bytearray(raw[y * (stride + 1) + 1:(y + 1) * (stride + 1)])
              for x in range(stride) if f else ():
                  a, b = line[x - bpp] if x >= bpp else 0, prev[x]
                  c = prev[x - bpp] if x >= bpp else 0
                  if f == 4:
                      p = a + b - c
                      a = a if abs(p - a) <= abs(p - b) and abs(p - a) <= abs(p - c) else b if abs(p - b) <= abs(p - c) else c
                  line[x] = (line[x] + (a if f in (1, 4) else b if f == 2 else (a + b) // 2)) & 255
              first = first or line[:bpp]
              if line != first * w:
                  solid = False
                  break
              prev = line
          print(w, h, len(d), "one solid colour" if solid else "drawn")
          sys.exit(0 if (w, h) == (720, 1280) and len(d) > int(sys.argv[2]) and not solid else 1)
          EOF
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" start-server
          # The KVM run lets emu choose (auto) and checks it chose KVM; the TCG run turns KVM off.
          if [ "$ACCEL" = kvm ]; then accel=(); else accel=(-accel off); fi
          start=$(date +%s.%N)
          target/release/emu -avd ci -verbose "${accel[@]}" > emu.log 2>&1 &
          pid=$!
          # A fresh userdata's first boot under TCG: 375 s on a 4-vCPU Xeon; allow 30 minutes.
          for _ in $(seq 1 900); do
            grep -q "boot completed" emu.log && break
            kill -0 "$pid" || { echo "emu exited before boot completed"; exit 1; }
            sleep 2
          done
          grep "boot completed" emu.log
          test "$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          echo "EMU_BOOT_S=$(echo "$(date +%s.%N) - $start" | bc)" >> "$GITHUB_ENV"
          if [ "$ACCEL" = kvm ]; then grep "guest CPU on KVM" emu.log; else grep "guest CPU on TCG (-accel off)" emu.log; fi
          if [ "$FULL" = true ]; then sleep 30; min=20000; else min=0; fi
          drawn=
          for _ in $(seq 1 40); do
            target/release/simee screenshot ci shot.png && python3 "$RUNNER_TEMP/drawn.py" shot.png "$min" && { drawn=1; break; }
            sleep 2
          done
          test -n "$drawn"
          target/release/simee tap ci 360 600
          "$adb" -s emulator-5554 emu kill
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          ! kill -0 "$pid" 2>/dev/null
      # The same image's first boot in the stock emulator, on the same runner and KVM, measured the
      # same way: from launch to `sys.boot_completed` over adb. The runner's sdkmanager installs
      # the emulator package into the cached SDK.
      - name: Stock emulator first boot
        if: matrix.accel == 'kvm'
        run: |
          yes 2>/dev/null | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" emulator > /dev/null
          "$ANDROID_HOME/emulator/emulator" -version | head -1 | tee stock-version.txt
          target/release/emu -create-avd stock -sysdir system-images/android-36/default/x86_64 -no-golden
          adb="$ANDROID_HOME/platform-tools/adb"
          start=$(date +%s.%N)
          "$ANDROID_HOME/emulator/emulator" -avd stock -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -accel on > stock.log 2>&1 &
          pid=$!
          booted=
          for _ in $(seq 1 450); do
            [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { booted=1; break; }
            kill -0 "$pid" || { echo "the stock emulator exited before boot completed"; tail -30 stock.log; exit 1; }
            sleep 2
          done
          test -n "$booted"
          stock=$(echo "$(date +%s.%N) - $start" | bc)
          "$adb" -s emulator-5554 emu kill
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          {
            echo "### First boot to sys.boot_completed, API 36 default x86_64, KVM ($(nproc) vCPUs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs))"
            echo
            echo "| Emulator | Seconds |"
            echo "|---|---|"
            printf '| emu (software mode on KVM) | %.1f |\n' "$EMU_BOOT_S"
            printf '| stock %s | %.1f |\n' "$(sed 's/.*version //' stock-version.txt)" "$stock"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && matrix.accel == 'tcg'
        run: |
          printf '### First boot to sys.boot_completed under TCG (-accel off): %.1f s\n' "${EMU_BOOT_S:-0}" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-mode-${{ matrix.accel }}
          path: |
            emu.log
            stock.log
            shot.png
            ${{ runner.temp }}/avd/ci.avd/simee/console.log
          if-no-files-found: ignore
