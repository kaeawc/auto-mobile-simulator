[workspace]
resolver = "3"
# sim-* crates: the shared core (sim-core, sim-api) and the iOS backend; emu-* crates: the Android
# backend (an emulator on Hypervisor.framework); apps: the simee CLI and the emu emulator binary.
members = ["crates/*", "apps/simee", "apps/emu"]
# The Rune desktop app is its own workspace: a large git dependency and a GPU stack stay out of
# `cargo check`/`test` here.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every crate inherits deps from here, so each dependency is built with one feature set no matter
# which `-p` subset you build.
[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-coresim = { path = "crates/sim-coresim" }
sim-debug = { path = "crates/sim-debug" }
sim-api = { path = "crates/sim-api" }
sim-mcp = { path = "crates/sim-mcp" }
sim-netshape = { path = "crates/sim-netshape" }
sim-audio = { path = "crates/sim-audio" }
sim-android = { path = "crates/sim-android" }
sim-bundle = { path = "crates/sim-bundle" }
emu-avd = { path = "crates/emu-avd" }
emu-gfxstream = { path = "crates/emu-gfxstream" }
emu-ext4 = { path = "crates/emu-ext4" }
emu-fdt = { path = "crates/emu-fdt" }
emu-hvf = { path = "crates/emu-hvf" }
emu-kvm = { path = "crates/emu-kvm" }
emu-sdk = { path = "crates/emu-sdk" }
emu-vmm = { path = "crates/emu-vmm" }

anyhow = "1"
base64 = "0.23"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
png = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crc32fast = { version = "1", default-features = false, features = ["std"] }
# zlib-rs: ~2x miniz_oxide's inflate on a gzip kernel; runtime_detection lets it use the CPU's
# crc32 instructions.
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
libc = { version = "0.2", default-features = false }
# Safe syscall wrappers (plain fsync: std's sync_data is F_FULLFSYNC on macOS; the adb bridge's
# non-blocking send).
rustix = { version = "1", default-features = false, features = ["event", "fs", "net", "process", "std"] }
# The user-mode NAT behind virtio-net (emu-vmm): smoltcp's TCP state machine, in safe Rust. Its
# unsafe code is only in the tap, raw-socket and bpf backends, which stay off.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }
# SDK repository manifests (emu-sdk): a small read-only XML tree.
roxmltree = { version = "0.21", default-features = false, features = ["std"] }
# The SDK repository publishes sha1 checksums; dependency-free pure Rust.
sha1_smol = { version = "1", default-features = false }
# Device bundles (sim-bundle): chunk and whole-disk hashes, and per-chunk compression. blake3's
# `std` gives `update_reader` (it falls back to Rust intrinsics when no C compiler targets the
# build). lz4_flex is pure Rust with its unsafe fast paths off (`safe-encode`, `safe-decode`): no
# C toolchain, so `scripts/check.sh` lints the Linux target from macOS too.
blake3 = { version = "1", default-features = false, features = ["std"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode"] }
# Host audio for emu's virtio-snd card (CoreAudio on macOS; emu-vmm only, macOS only).
cpal = { version = "0.18", default-features = false }
# Linux KVM (emu-kvm only): the rust-vmm ioctl wrappers Firecracker and Cloud Hypervisor use,
# the generated uapi structs, and their eventfd/signal helpers.
kvm-ioctls = { version = "0.25", default-features = false }
kvm-bindings = { version = "0.14", default-features = false }
vmm-sys-util = { version = "0.15", default-features = false }
# Objective-C runtime bindings. Only sim-coresim may depend on these.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
# Objective-C blocks, for the simulator service's completion handlers (sim-coresim only).
block2 = { version = "0.6", default-features = false, features = ["std"] }

# unsafe is forbidden everywhere except the FFI crates, which set their own lints: sim-coresim
# (Objective-C), emu-hvf (Hypervisor.framework, guest RAM), emu-kvm (Linux KVM), emu-gfxstream (the renderer) and
# apps/emu (one signal-mask function, so `deny` there instead of `forbid`).
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"
# 16 codegen units instead of the dev default 256: fewer, larger units cut incremental relink and
# per-unit bookkeeping (docs/build.md: sim-core one-line change 2.2 s to 1.3 s).
codegen-units = 16

[profile.dev.package."*"]
debug = false
opt-level = 0

# The dependencies on a runtime hot path stay optimized in dev builds: the kernel's gunzip, the
# NAT's TCP state machine, checksums and PNG encoding. Everything else (serde, clap and their
# proc macros, syn, the Objective-C bindings) costs ~40% of a clean build's CPU time at opt-level 2
# and runs only at startup.
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.smoltcp]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
# `-provision` checks each multi-GB system image download's SHA-1.
[profile.dev.package.sha1_smol]
opt-level = 3
[profile.dev.package.cpal]
opt-level = 2

# The Android VMM sits on the guest's hot path (every MMIO exit, every block request); unoptimized
# it boots the guest several times slower.
[profile.dev.package.emu-vmm]
opt-level = 1
[profile.dev.package.emu-hvf]
opt-level = 1
[profile.dev.package.emu-gfxstream]
opt-level = 1
[profile.dev.package.emu]
opt-level = 1

# Tests don't run guests: build the VMM crates unoptimized there, which takes the incremental
# test build after a sim-core change from ~17 s to ~10 s (opt-level 1 is for running `emu`).
[profile.test.package.emu-vmm]
opt-level = 0
[profile.test.package.emu-hvf]
opt-level = 0
[profile.test.package.emu]
opt-level = 0

# PNG encoding of full-resolution framebuffers is the hot path of `screenshot` in debug builds.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.build-override]
opt-level = 0
debug = false

[profile.release]
codegen-units = 16
incremental = true
strip = "debuginfo"

[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true

[profile.ci]
inherits = "dev"
debug = false
incremental = false
