[package]
name = "simee-host"
description = "Host health for simulator farms: load, memory pressure, swap, disk and an admit/hold/backoff verdict, sampled without forking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["host", "load", "memory", "pressure", "macos"]
categories = ["development-tools::testing", "os"]
include = ["/Cargo.toml", "/LICENSE", "/src"]

[lib]
doctest = false

[dependencies]
rustix.workspace = true
serde.workspace = true
sim-core.workspace = true

# macOS reads the kernel's sysctls through sim-coresim, the one crate here that allows `unsafe`.
[target.'cfg(target_os = "macos")'.dependencies]
sim-coresim.workspace = true

[lints]
workspace = true
