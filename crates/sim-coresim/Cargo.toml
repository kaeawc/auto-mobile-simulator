[package]
name = "sim-coresim"
description = "Safe API over the host simulator service: device lifecycle, apps, framebuffers and HID input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
sim-core.workspace = true

# The simulator service is macOS-only; elsewhere the crate compiles to nothing.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
thiserror.workspace = true

# FFI boundary: this crate talks to the Objective-C runtime, so `unsafe` is allowed here (and only
# in the FFI crates). Everything else mirrors the workspace lints.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
