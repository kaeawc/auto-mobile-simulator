[package]
name = "emu-gfxstream"
description = "Loads the SDK's gfxstream renderer (stream_renderer C API) at runtime: host GLES/Vulkan for virtio-gpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
emu-hvf.workspace = true
libc.workspace = true
sim-core.workspace = true
thiserror.workspace = true

# FFI crate: unsafe is allowed here (every block carries a SAFETY comment), denied elsewhere.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
