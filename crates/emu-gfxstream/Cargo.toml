[package]
name = "simee-emu-gfxstream"
description = "Loads the SDK's gfxstream renderer (stream_renderer C API) at runtime: host GLES/Vulkan for virtio-gpu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "emulator", "gfxstream", "gpu", "virtio"]
categories = ["emulators", "graphics"]
include = ["/Cargo.toml", "/LICENSE", "/build.rs", "/examples", "/src"]

[lib]
doctest = false

[dependencies]
emu-hvf.workspace = true
libc.workspace = true
sim-core.workspace = true
thiserror.workspace = true

# FFI crate: unsafe is allowed here (every block carries a SAFETY comment), denied elsewhere.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
