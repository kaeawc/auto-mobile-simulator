[package]
name = "simee-emu-kvm"
description = "Safe wrappers over Linux KVM (kvm-ioctls): the VM, guest memory slots, the in-kernel vGICv3, ioeventfd/irqfd, vCPUs and their kicks. FFI crate: unsafe is allowed here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["kvm", "hypervisor", "linux", "virtualization", "arm64"]
categories = ["virtualization", "os::linux-apis"]
include = ["/Cargo.toml", "/src"]

[lib]
# Code names the crate as it did before the crates.io rename: `emu_kvm::`.
name = "emu_kvm"
doctest = false

[dependencies]
emu-hvf.workspace = true
libc.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings.workspace = true
kvm-ioctls.workspace = true
vmm-sys-util.workspace = true

# FFI crate: unsafe is allowed here (every block carries a SAFETY comment), denied elsewhere.
[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"
