[package]
name = "simee-emu-sdk"
description = "SDK provisioning without Java: repository manifests, verified downloads, unpacking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "sdk", "emulator", "provisioning"]
categories = ["emulators", "development-tools"]
include = ["/Cargo.toml", "/LICENSE", "/src", "/testdata"]

[lib]
doctest = false

[dependencies]
emu-hvf.workspace = true
flate2 = { workspace = true, optional = true }
roxmltree.workspace = true
sha1_smol.workspace = true
sim-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
flate2.workspace = true

[features]
# `testing::stored_zip`, for other crates' tests.
testing = ["dep:flate2"]

[lints]
workspace = true
