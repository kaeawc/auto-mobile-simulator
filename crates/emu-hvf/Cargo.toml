[package]
name = "emu-hvf"
description = "Safe wrappers over Hypervisor.framework (arm64): VM, vCPUs, in-kernel GICv3, guest RAM. The only crate with unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
libc.workspace = true
thiserror.workspace = true

[dev-dependencies]
rustix.workspace = true

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
