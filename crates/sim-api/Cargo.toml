[package]
name = "simee-api"
description = "simee unix socket API: a JSON-lines protocol over every device control and debug surface, for iOS and Android devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ios", "android", "simulator", "emulator", "automation"]
categories = ["development-tools::testing", "simulation"]
include = ["/Cargo.toml", "/LICENSE", "/examples", "/native", "/src", "/tests"]

[lib]
doctest = false

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sim-core.workspace = true
sim-android.workspace = true
sim-coresim.workspace = true
sim-debug.workspace = true
sim-netshape.workspace = true
sim-audio.workspace = true
sim-host.workspace = true

[dev-dependencies]
emu-avd.workspace = true
sim-android = { workspace = true, features = ["testing"] }

[lints]
workspace = true
