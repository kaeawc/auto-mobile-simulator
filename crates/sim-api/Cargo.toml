[package]
name = "simee-api"
description = "simee unix socket API: a JSON-lines protocol over every device control and debug surface, for iOS and Android devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ios", "android", "simulator", "emulator", "automation"]
categories = ["development-tools::testing", "simulation"]
include = ["/Cargo.toml", "/LICENSE", "/examples", "/native", "/src", "/tests"]

[lib]
doctest = false

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sim-core.workspace = true
sim-android.workspace = true
# `device:` camera sources are read here (`src/camera_device.rs`), not in sim-camera, which emu
# links: emu reads them from this crate's server as a `feed:`.
sim-camera.workspace = true
sim-coresim.workspace = true
sim-debug.workspace = true
sim-netshape.workspace = true
sim-audio.workspace = true
sim-host.workspace = true
# Streams (`stream_*`): the encoder and the WHIP publisher.
sim-encode.workspace = true
sim-rtc.workspace = true
# SIGINT/SIGTERM: the servers shut down in order (`src/shutdown.rs`).
signal-hook.workspace = true

[dev-dependencies]
emu-avd.workspace = true
sim-android = { workspace = true, features = ["testing"] }

[lints]
workspace = true
