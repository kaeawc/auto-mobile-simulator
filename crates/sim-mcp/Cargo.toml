[package]
name = "simee-mcp"
description = "simee's MCP server: every API method as a tool, devices as resources, long operations as tasks, and a device view as an MCP App, over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mcp", "ios", "android", "simulator", "emulator"]
categories = ["development-tools::testing", "simulation"]
include = ["/Cargo.toml", "/src"]

[lib]
# Code names the crate as it did before the crates.io rename: `sim_mcp::`.
name = "sim_mcp"
doctest = false

[dependencies]
serde_json.workspace = true
sim-api.workspace = true

[dev-dependencies]
emu-avd.workspace = true
sim-android = { workspace = true, features = ["testing"] }

[lints]
workspace = true
