[alias]
# The inner loop: type-check everything (no codegen, no linking).
c = "check --all-targets"
# Lint like CI does.
lint = "clippy --all-targets -- -D warnings"
# Tests through nextest (one process per test, parallel across binaries).
t = "nextest run"
# Tests in a single crate without touching the rest.
tc = "nextest run -p simee-core"

# Hypervisor.framework refuses unsigned callers. Every binary cargo runs (the `emu` emulator, the
# simee CLI and test binaries) is ad-hoc signed with the hypervisor entitlement first; for
# binaries that don't use it the signature changes nothing.
[target.aarch64-apple-darwin]
runner = "scripts/sign-run.sh"

[env]
RUST_BACKTRACE = { value = "short", force = false }
